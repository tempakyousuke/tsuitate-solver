[package]
name = "tsuitate-solver"
version = "0.1.0"
description = "Tsuitate Tsumeshogi Solver"
authors = ["you"]
edition = "2021"

[lib]
name = "tsuitate_solver_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "tsuitate-solver-cli"
path = "src/bin/cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
chrono = "0.4"
